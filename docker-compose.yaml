services:
  finance-postgres:
    image: postgres:15-alpine
    container_name: finance-env-postgres
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${FINANCE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${FINANCE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${FINANCE_POSTGRES_DB}
    volumes:
      - ./out/pgdata/finance:/var/lib/postgresql/data:rw
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${FINANCE_POSTGRES_USER} -d ${FINANCE_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  auth-postgres:
    image: postgres:15-alpine
    container_name: auth-env-postgres
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${AUTH_POSTGRES_USER}
      - POSTGRES_PASSWORD=${AUTH_POSTGRES_PASSWORD}
      - POSTGRES_DB=${AUTH_POSTGRES_DB}
    volumes:
      - ./out/pgdata/auth:/var/lib/postgresql/data:rw
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  users-postgres:
    image: postgres:15-alpine
    container_name: users-env-postgres
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${USERS_POSTGRES_USER}
      - POSTGRES_PASSWORD=${USERS_POSTGRES_PASSWORD}
      - POSTGRES_DB=${USERS_POSTGRES_DB}
    volumes:
      - ./out/pgdata/users:/var/lib/postgresql/data:rw
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USERS_POSTGRES_USER} -d ${USERS_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  shopping-postgres:
    image: postgres:15-alpine
    container_name: shopping-env-postgres
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${SHOPPING_POSTGRES_USER}
      - POSTGRES_PASSWORD=${SHOPPING_POSTGRES_PASSWORD}
      - POSTGRES_DB=${SHOPPING_POSTGRES_DB}
    volumes:
      - ./out/pgdata/shopping:/var/lib/postgresql/data:rw
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SHOPPING_POSTGRES_USER} -d ${SHOPPING_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  saga-postgres:
    image: postgres:15-alpine
    container_name: saga-env-postgres
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${SAGA_POSTGRES_USER}
      - POSTGRES_PASSWORD=${SAGA_POSTGRES_PASSWORD}
      - POSTGRES_DB=${SAGA_POSTGRES_DB}
    volumes:
      - ./out/pgdata/saga:/var/lib/postgresql/data:rw
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SAGA_POSTGRES_USER} -d ${SAGA_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ai-postgres:
    image: postgres:15-alpine
    container_name: ai-env-postgres
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${AI_POSTGRES_USER}
      - POSTGRES_PASSWORD=${AI_POSTGRES_PASSWORD}
      - POSTGRES_DB=${AI_POSTGRES_DB}
    volumes:
      - ./out/pgdata/ai:/var/lib/postgresql/data:rw
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AI_POSTGRES_USER} -d ${AI_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  finance-redis:
    image: redis:7-alpine
    container_name: finance-redis
    networks:
      - finance-net
    ports:
      - "6379:6379"
    volumes:
      - ./out/redisdata:/data
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: finance-kafka
    networks:
      - finance-net
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: pgsty/minio:latest
    container_name: finance-minio
    networks:
      - finance-net
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: finance-clickhouse
    networks:
      - finance-net
    ports:
      - "8123:8123"
      - "9003:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: finance
      CLICKHOUSE_USER: finance_user
      CLICKHOUSE_PASSWORD: finance_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--user", "finance_user", "--password", "finance_pass", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always


  auth-postgres-migrate:
    image: migrate/migrate:latest
    networks:
      - finance-net
    volumes:
      - ./auth-service/migrations:/migrations
    environment:
      - AUTH_POSTGRES_USER=${AUTH_POSTGRES_USER}
      - AUTH_POSTGRES_PASSWORD=${AUTH_POSTGRES_PASSWORD}
      - AUTH_POSTGRES_DB=${AUTH_POSTGRES_DB}
    depends_on:
      auth-postgres:
        condition: service_healthy
    entrypoint: |
      sh -c "
        echo 'Applying auth migrations...' &&
        migrate -path /migrations -database postgres://${AUTH_POSTGRES_USER}:${AUTH_POSTGRES_PASSWORD}@auth-postgres:5432/${AUTH_POSTGRES_DB}?sslmode=disable up
      "
    restart: "no"

  users-postgres-migrate:
    image: migrate/migrate:latest
    networks:
      - finance-net
    volumes:
      - ./users-service/migrations:/migrations
    environment:
      - USERS_POSTGRES_USER=${USERS_POSTGRES_USER}
      - USERS_POSTGRES_PASSWORD=${USERS_POSTGRES_PASSWORD}
      - USERS_POSTGRES_DB=${USERS_POSTGRES_DB}
    depends_on:
      users-postgres:
        condition: service_healthy
    entrypoint: |
      sh -c "
        echo 'Applying users migrations...' &&
        migrate -path /migrations -database postgres://${USERS_POSTGRES_USER}:${USERS_POSTGRES_PASSWORD}@users-postgres:5432/${USERS_POSTGRES_DB}?sslmode=disable up
      "
    restart: "no"

  finance-postgres-migrate:
    image: migrate/migrate:latest
    networks:
      - finance-net
    volumes:
      - ./finance-service/migrations:/migrations
    environment:
      - FINANCE_POSTGRES_USER=${FINANCE_POSTGRES_USER}
      - FINANCE_POSTGRES_PASSWORD=${FINANCE_POSTGRES_PASSWORD}
      - FINANCE_POSTGRES_DB=${FINANCE_POSTGRES_DB}
    depends_on:
      finance-postgres:
        condition: service_healthy
    entrypoint: |
      sh -c "
        echo 'Applying finance migrations...' &&
        migrate -path /migrations -database postgres://${FINANCE_POSTGRES_USER}:${FINANCE_POSTGRES_PASSWORD}@finance-postgres:5432/${FINANCE_POSTGRES_DB}?sslmode=disable up
      "
    restart: "no"

  shopping-list-migrate:
    image: migrate/migrate:latest
    networks:
      - finance-net
    volumes:
      - ./shopping-list-service/migrations:/migrations
    environment:
      - SHOPPING_POSTGRES_USER=${SHOPPING_POSTGRES_USER}
      - SHOPPING_POSTGRES_PASSWORD=${SHOPPING_POSTGRES_PASSWORD}
      - SHOPPING_POSTGRES_DB=${SHOPPING_POSTGRES_DB}
    depends_on:
      shopping-postgres:
        condition: service_healthy
    entrypoint:
      sh -c "
      echo 'Applying shopping-list migrations' &&
      migrate -path /migrations -database postgres://${SHOPPING_POSTGRES_USER}:${SHOPPING_POSTGRES_PASSWORD}@shopping-postgres:5432/${SHOPPING_POSTGRES_DB}?sslmode=disable up
      "
    restart: "no"

  saga-postgres-migrate:
    image: migrate/migrate:latest
    networks:
      - finance-net
    volumes:
      - ./saga-orchestrator-service/migrations:/migrations
    environment:
      - SAGA_POSTGRES_USER=${SAGA_POSTGRES_USER}
      - SAGA_POSTGRES_PASSWORD=${SAGA_POSTGRES_PASSWORD}
      - SAGA_POSTGRES_DB=${SAGA_POSTGRES_DB}
    depends_on:
      saga-postgres:
        condition: service_healthy
    entrypoint:
      sh -c "
      echo 'Applying saga migrations' &&
      migrate -path /migrations -database postgres://${SAGA_POSTGRES_USER}:${SAGA_POSTGRES_PASSWORD}@saga-postgres:5432/${SAGA_POSTGRES_DB}?sslmode=disable up
      "
    restart: "no"

  ai-postgres-migrate:
    image: migrate/migrate:latest
    networks:
      - finance-net
    volumes:
      - ./ai-service/migrations:/migrations
    environment:
      - AI_POSTGRES_USER=${AI_POSTGRES_USER}
      - AI_POSTGRES_PASSWORD=${AI_POSTGRES_PASSWORD}
      - AI_POSTGRES_DB=${AI_POSTGRES_DB}
    depends_on:
      ai-postgres:
        condition: service_healthy
    entrypoint:
      sh -c "
      echo 'Applying ai migrations' &&
      migrate -path /migrations -database postgres://${AI_POSTGRES_USER}:${AI_POSTGRES_PASSWORD}@ai-postgres:5432/${AI_POSTGRES_DB}?sslmode=disable up
      "
    restart: "no"

  clickhouse-migrate:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: finance-clickhouse-migrate
    networks:
      - finance-net
    volumes:
      - ./finance-service/clickhouse-migrations:/migrations
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-finance_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-finance_pass}
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: |
      sh -c "
        echo 'Applying ClickHouse migrations...'
        for f in /migrations/*.sql; do
          echo \"Applying $$f...\"
          clickhouse-client --host $$CLICKHOUSE_HOST --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --multiquery < $$f
        done
        echo 'ClickHouse migrations applied.'
      "
    restart: "no"


  auth:
    build:
      context: .
      dockerfile: build/auth/Dockerfile
    container_name: auth-service
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${AUTH_POSTGRES_USER}
      - POSTGRES_PASSWORD=${AUTH_POSTGRES_PASSWORD}
      - POSTGRES_DB=${AUTH_POSTGRES_DB}
      - POSTGRES_HOST=auth-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${LOGGER_FOLDER}
      - TIME_ZONE=${TIME_ZONE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DURATION=${JWT_DURATION}
      - REDIS_ADDR=${REDIS_ADDR}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_CONSUMER_GROUP=auth-service
      - KAFKA_TOPIC=finance-events
      - TLS_ENABLED=${TLS_ENABLED}
      - TLS_CERT_FILE=${TLS_CERT_FILE}
      - TLS_KEY_FILE=${TLS_KEY_FILE}
      - TLS_CA_FILE=${TLS_CA_FILE}
    volumes:
      - ./logs:/out/logs
      - ./certs:/certs:ro
    ports:
      - "50051:50051"
      - "9091:9091"
    restart: always
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-postgres-migrate:
        condition: service_completed_successfully
      finance-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  users:
    build:
      context: .
      dockerfile: build/users/Dockerfile
    container_name: users-service
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${USERS_POSTGRES_USER}
      - POSTGRES_PASSWORD=${USERS_POSTGRES_PASSWORD}
      - POSTGRES_DB=${USERS_POSTGRES_DB}
      - POSTGRES_HOST=users-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${LOGGER_FOLDER}
      - TIME_ZONE=${TIME_ZONE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DURATION=${JWT_DURATION}
      - REDIS_ADDR=${REDIS_ADDR}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_CONSUMER_GROUP=users-service
      - TLS_ENABLED=${TLS_ENABLED}
      - TLS_CERT_FILE=${TLS_CERT_FILE}
      - TLS_KEY_FILE=${TLS_KEY_FILE}
      - TLS_CA_FILE=${TLS_CA_FILE}
    volumes:
      - ./logs:/out/logs
      - ./certs:/certs:ro
    ports:
      - "50052:50052"
      - "9096:9096"
    restart: always
    depends_on:
      users-postgres:
        condition: service_healthy
      users-postgres-migrate:
        condition: service_completed_successfully
      finance-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  finance:
    build:
      context: .
      dockerfile: build/finance/Dockerfile
    container_name: finance-service
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${FINANCE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${FINANCE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${FINANCE_POSTGRES_DB}
      - POSTGRES_HOST=${FINANCE_POSTGRES_HOST}
      - POSTGRES_PORT=${FINANCE_POSTGRES_PORT}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_TIMEOUT=${CLICKHOUSE_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${LOGGER_FOLDER}
      - TIME_ZONE=${TIME_ZONE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DURATION=${JWT_DURATION}
      - REDIS_ADDR=${REDIS_ADDR}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_CONSUMER_GROUP=finance-service
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - TLS_ENABLED=${TLS_ENABLED}
      - TLS_CERT_FILE=${TLS_CERT_FILE}
      - TLS_KEY_FILE=${TLS_KEY_FILE}
      - TLS_CA_FILE=${TLS_CA_FILE}
    volumes:
      - ./logs:/out/logs
      - ./certs:/certs:ro
    ports:
      - "50053:50053"
      - "9093:9093"
    restart: always
    depends_on:
      finance-postgres:
        condition: service_healthy
      finance-postgres-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
      finance-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started

  admin:
    build:
      context: .
      dockerfile: build/admin/Dockerfile
    container_name: admin-service
    networks:
      - finance-net
    environment:
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${LOGGER_FOLDER}
      - TIME_ZONE=${TIME_ZONE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DURATION=${JWT_DURATION}
      - REDIS_ADDR=${REDIS_ADDR}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - TLS_ENABLED=${TLS_ENABLED}
      - TLS_CERT_FILE=${TLS_CERT_FILE}
      - TLS_KEY_FILE=${TLS_KEY_FILE}
      - TLS_CA_FILE=${TLS_CA_FILE}
    volumes:
      - ./logs:/out/logs
      - ./certs:/certs:ro
    ports:
      - "50054:50054"
      - "9094:9094"
    restart: always
    depends_on:
      finance-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  currency:
    build:
      context: .
      dockerfile: build/currency/Dockerfile
    container_name: currency-service
    networks:
      - finance-net
    environment:
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${LOGGER_FOLDER}
      - TIME_ZONE=${TIME_ZONE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DURATION=${JWT_DURATION}
      - REDIS_ADDR=${REDIS_ADDR}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - CURRENCY_API_URL=${CURRENCY_API_URL}
      - TLS_ENABLED=${TLS_ENABLED}
      - TLS_CERT_FILE=${TLS_CERT_FILE}
      - TLS_KEY_FILE=${TLS_KEY_FILE}
      - TLS_CA_FILE=${TLS_CA_FILE}
    volumes:
      - ./logs:/out/logs
      - ./certs:/certs:ro
    ports:
      - "50055:50055"
      - "9095:9095"
    restart: always
    depends_on:
      finance-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  shopping-list:
    build:
      context: .
      dockerfile: build/shopping/Dockerfile
    container_name: shopping-service
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${SHOPPING_POSTGRES_USER}
      - POSTGRES_PASSWORD=${SHOPPING_POSTGRES_PASSWORD}
      - POSTGRES_DB=${SHOPPING_POSTGRES_DB}
      - POSTGRES_HOST=${SHOPPING_POSTGRES_HOST}
      - POSTGRES_PORT=${SHOPPING_POSTGRES_PORT}
      - POSTGRES_TIMEOUT=${SHOPPING_POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${LOGGER_FOLDER}
      - TIME_ZONE=${TIME_ZONE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DURATION=${JWT_DURATION}
      - REDIS_ADDR=${REDIS_ADDR}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_CONSUMER_GROUP=shopping-list-service
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - TLS_ENABLED=${TLS_ENABLED}
      - TLS_CERT_FILE=${TLS_CERT_FILE}
      - TLS_KEY_FILE=${TLS_KEY_FILE}
      - TLS_CA_FILE=${TLS_CA_FILE}
      - SHOPPING_GRPC_PORT=${SHOPPING_GRPC_PORT}
      - SHOPPING_METRICS_PORT=${SHOPPING_METRICS_PORT}
    volumes:
      - ./shopping-list-service/public:/root/public
      - ./logs:/out/logs
      - ./certs:/certs:ro
    ports:
      - "50060:50060"
      - "9097:9097"
      - "8090:8090"
    restart: always
    depends_on:
      shopping-postgres:
        condition: service_healthy
      shopping-list-migrate:
        condition: service_completed_successfully
      finance-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started

  saga:
    build:
      context: .
      dockerfile: build/saga/Dockerfile
    container_name: saga-service
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${SAGA_POSTGRES_USER}
      - POSTGRES_PASSWORD=${SAGA_POSTGRES_PASSWORD}
      - POSTGRES_DB=${SAGA_POSTGRES_DB}
      - POSTGRES_HOST=${SAGA_POSTGRES_HOST}
      - POSTGRES_PORT=${SAGA_POSTGRES_PORT}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${LOGGER_FOLDER}
      - TIME_ZONE=${TIME_ZONE}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_CONSUMER_GROUP=saga-orchestrator-service
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DURATION=${JWT_DURATION}
      - TLS_ENABLED=${TLS_ENABLED}
      - TLS_CERT_FILE=${TLS_CERT_FILE}
      - TLS_KEY_FILE=${TLS_KEY_FILE}
      - TLS_CA_FILE=${TLS_CA_FILE}
      - SAGA_GRPC_PORT=${SAGA_GRPC_PORT}
      - SAGA_METRICS_PORT=${SAGA_METRICS_PORT}
    volumes:
      - ./logs:/out/logs
      - ./certs:/certs:ro
    ports:
      - "50061:50061"
      - "9098:9098"
    restart: always
    depends_on:
      saga-postgres:
        condition: service_healthy
      saga-postgres-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: build/ai/Dockerfile
    container_name: ai-service
    networks:
      - finance-net
    environment:
      - POSTGRES_USER=${AI_POSTGRES_USER}
      - POSTGRES_PASSWORD=${AI_POSTGRES_PASSWORD}
      - POSTGRES_DB=${AI_POSTGRES_DB}
      - POSTGRES_HOST=ai-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - TIME_ZONE=${TIME_ZONE}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${LOGGER_FOLDER}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DURATION=${JWT_DURATION}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=${GROQ_BASE_URL}
      - GROQ_MODEL=${GROQ_MODEL}
      - GROQ_TIMEOUT=${GROQ_TIMEOUT}
      - GROQ_MAX_RETRIES=${GROQ_MAX_RETRIES}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TAVILY_BASE_URL=${TAVILY_BASE_URL}
      - TAVILY_TIMEOUT=${TAVILY_TIMEOUT}
      - NOMINATIM_URL=${NOMINATIM_URL}
      - NOMINATIM_USER_AGENT=${NOMINATIM_USER_AGENT}
      - NOMINATIM_TIMEOUT=${NOMINATIM_TIMEOUT}
      - OSRM_URL=${OSRM_URL}
      - OSRM_TIMEOUT=${OSRM_TIMEOUT}
      - FUEL_CONSUMPTION_L_PER_100KM=${FUEL_CONSUMPTION_L_PER_100KM}
      - FUEL_PRICE_PER_LITER=${FUEL_PRICE_PER_LITER}
      - TAXI_PRICE_PER_KM=${TAXI_PRICE_PER_KM}
      - TRAVEL_COST_MODE=${TRAVEL_COST_MODE}
      - AI_GRPC_PORT=${AI_GRPC_PORT}
      - AI_METRICS_PORT=${AI_METRICS_PORT}
      - REDIS_ADDR=${REDIS_ADDR}
      - CACHE_TTL=${CACHE_TTL}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_CONSUMER_GROUP=ai-service
      - KAFKA_TOPIC=finance-events
      - TLS_ENABLED=${TLS_ENABLED}
      - TLS_CERT_FILE=${TLS_CERT_FILE}
      - TLS_KEY_FILE=${TLS_KEY_FILE}
      - TLS_CA_FILE=${TLS_CA_FILE}
    volumes:
      - ./logs:/out/logs
      - ./certs:/certs:ro
    ports:
      - "${AI_GRPC_PORT:-50056}:${AI_GRPC_PORT:-50056}"
      - "${AI_METRICS_PORT:-9099}:${AI_METRICS_PORT:-9099}"
    restart: always
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-postgres-migrate:
        condition: service_completed_successfully
      finance-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: build/gateway/Dockerfile
    container_name: gateway-service
    networks:
      - finance-net
    environment:
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${LOGGER_FOLDER}
      - TIME_ZONE=${TIME_ZONE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DURATION=${JWT_DURATION}
      - TLS_ENABLED=${TLS_ENABLED}
      - TLS_CERT_FILE=${TLS_CERT_FILE}
      - TLS_KEY_FILE=${TLS_KEY_FILE}
      - TLS_CA_FILE=${TLS_CA_FILE}
    volumes:
      - ./certs:/certs:ro
      - ./docs:/root/docs:ro
    ports:
      - "8081:8081"
    restart: always
    depends_on:
      auth:
        condition: service_started
      users:
        condition: service_started
      finance:
        condition: service_started
      admin:
        condition: service_started
      currency:
        condition: service_started
      shopping-list:
        condition: service_started
      saga:
        condition: service_started
      ai:
        condition: service_started

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: finance-kafka-ui
    networks:
      - finance-net
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: finance-jaeger
    networks:
      - finance-net
    ports:
      - "16686:16686"
      - "4317:4317"
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:latest
    container_name: finance-prometheus
    networks:
      - finance-net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./out/prometheus:/prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  nominatim:
    image: mediagis/nominatim:4.4
    container_name: finance-nominatim
    networks:
      - finance-net
    environment:
      PBF_URL: https://download.geofabrik.de/russia-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/europe/monaco-updates/
      NOMINATIM_PASSWORD: nominatim
    ports:
      - "8088:8080"
    volumes:
      - nominatim-data:/var/lib/postgresql/14/main

volumes:
  clickhouse-data:
  nominatim-data:

networks:
  finance-net:
    driver: bridge