<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>FinGoals · AI-карта</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/telegram/webapp/assets/styles.css">
    <script defer src="/telegram/webapp/assets/app.js"></script>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div>
            <span class="eyebrow">AI-ПЛАНИРОВЩИК</span>
            <h1 id="title">Карта покупок</h1>
        </div>
        <button id="refresh" class="icon-button" type="button" aria-label="Обновить">↻</button>
    </header>

    <div id="status" class="status">Загрузка плана…</div>

    <section id="summary" class="summary" hidden>
        <div class="summary-grid">
            <div><span>Товары</span><b id="costItems">—</b></div>
            <div><span>Дорога</span><b id="costTravel">—</b></div>
            <div><span>Доставка</span><b id="costDelivery">—</b></div>
            <div class="total"><span>Итого</span><b id="costTotal">—</b></div>
        </div>
        <p id="recommendation" class="recommendation"></p>
    </section>

    <div id="map" class="map"></div>

    <section class="stores">
        <h2>Магазины и маршрут</h2>
        <div id="stores" class="stores-list"></div>
    </section>

    <section class="items">
        <h2>Список покупок</h2>
        <div id="items" class="items-list"></div>
    </section>
</div>
</body>
</html>
