basePath: /api/v1
definitions:
  backend_internal_core_domain.CategoryStat:
    properties:
      category:
        type: string
      percentage:
        type: number
      total:
        type: number
    type: object
  backend_internal_core_domain.DailyStat:
    properties:
      date:
        type: string
      expense:
        type: number
      income:
        type: number
    type: object
  backend_internal_core_domain.RecentTransaction:
    properties:
      amount:
        type: number
      category:
        type: string
      created_at:
        type: string
      id:
        type: integer
      type:
        type: string
    type: object
  backend_internal_core_transport_http_response.ErrorResponse:
    properties:
      error:
        example: full error text
        type: string
      message:
        example: short human-readable message
        type: string
    type: object
  backend_internal_features_auth_transport_http_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  backend_internal_features_auth_transport_http_dto.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      is_admin:
        type: boolean
      password:
        minLength: 8
        type: string
      phone_number:
        maxLength: 15
        minLength: 10
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  backend_internal_features_auth_transport_http_dto.UserResponse:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      phone_number:
        type: string
    type: object
  internal_features_admin_transport_http.AdminUserResponse:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      phone_number:
        type: string
      version:
        type: integer
    type: object
  internal_features_admin_transport_http.GetUsersResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_features_admin_transport_http.AdminUserResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  internal_features_admin_transport_http.MetricsResponse:
    properties:
      total_balance:
        type: number
      total_transactions:
        type: integer
      total_users:
        type: integer
    type: object
  internal_features_admin_transport_http.UpdateRoleRequest:
    properties:
      is_admin:
        type: boolean
    type: object
  internal_features_finance_transport_http.CreateTransactionRequest:
    properties:
      amount:
        type: number
      category:
        maxLength: 60
        minLength: 1
        type: string
      type_transaction:
        enum:
        - income
        - expense
        type: string
    required:
    - amount
    - category
    - type_transaction
    type: object
  internal_features_finance_transport_http.DashboardResponse:
    properties:
      daily_stats:
        items:
          $ref: '#/definitions/backend_internal_core_domain.DailyStat'
        type: array
      monthly_expenses:
        type: number
      monthly_income:
        type: number
      recent_transactions:
        items:
          $ref: '#/definitions/backend_internal_core_domain.RecentTransaction'
        type: array
      savings_rate:
        type: number
      top_categories:
        items:
          $ref: '#/definitions/backend_internal_core_domain.CategoryStat'
        type: array
      total_balance:
        type: number
    type: object
  internal_features_finance_transport_http.TransactionResponse:
    properties:
      amount:
        type: number
      category:
        type: string
      created_at:
        type: string
      id:
        type: integer
      type_transaction:
        type: string
      user_id:
        type: integer
      version:
        type: integer
    type: object
  internal_features_finance_transport_http.UpdateTransactionRequest:
    properties:
      amount:
        type: number
      category:
        maxLength: 60
        minLength: 1
        type: string
      type_transaction:
        enum:
        - income
        - expense
        type: string
    required:
    - amount
    - category
    - type_transaction
    type: object
  internal_features_users_transport_http.GetUserResponse:
    properties:
      email:
        example: email@gmain.com
        type: string
      full_name:
        example: FirstName LastName
        type: string
      id:
        example: 10
        type: integer
      is_admin:
        example: false
        type: boolean
      phone_number:
        example: "+799999999"
        type: string
      version:
        example: 1
        type: integer
    type: object
  internal_features_users_transport_http.PatchUserRequest:
    properties:
      full_name:
        example: John Doe
        type: string
      phone_number:
        example: "+799999999"
        type: string
    type: object
  internal_features_users_transport_http.PatchUserResponse:
    properties:
      email:
        example: email@gmain.com
        type: string
      full_name:
        example: FirstName LastName
        type: string
      id:
        example: 10
        type: integer
      is_admin:
        example: false
        type: boolean
      phone_number:
        example: "+799999999"
        type: string
      version:
        example: 1
        type: integer
    type: object
host: 127.0.0.1:5050
info:
  contact: {}
  description: Finance REST-API scheme
  title: Golang Finance-microservices
  version: "1.0"
paths:
  /admin/metrics:
    get:
      description: 'Возвращает общую статистику системы: количество пользователей,
        количество транзакций и общий баланс. Доступно только администраторам.'
      produces:
      - application/json
      responses:
        "200":
          description: Системные метрики
          schema:
            $ref: '#/definitions/internal_features_admin_transport_http.MetricsResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Доступ запрещён (требуются права администратора)
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Получить системные метрики
      tags:
      - admin
  /admin/users:
    get:
      description: Возвращает список всех пользователей с пагинацией. Доступно только
        администраторам.
      parameters:
      - description: Лимит (default 20)
        in: query
        name: limit
        type: integer
      - description: Смещение (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список пользователей с пагинацией
          schema:
            $ref: '#/definitions/internal_features_admin_transport_http.GetUsersResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Доступ запрещён (требуются права администратора)
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Получить список пользователей
      tags:
      - admin
  /admin/users/{id}:
    delete:
      description: Удаляет пользователя по ID. Доступно только администраторам. Транзакции
        пользователя удаляются автоматически (CASCADE).
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Пользователь успешно удалён
        "400":
          description: Неверный ID пользователя
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Доступ запрещён (не админ или удаление себя)
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Удалить пользователя
      tags:
      - admin
    get:
      description: Возвращает данные пользователя по ID. Доступно только администраторам.
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные пользователя
          schema:
            $ref: '#/definitions/internal_features_admin_transport_http.AdminUserResponse'
        "400":
          description: Неверный ID пользователя
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Доступ запрещён (требуются права администратора)
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Получить пользователя
      tags:
      - admin
  /admin/users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Назначает или снимает права администратора. Доступно только администраторам.
        Нельзя изменить свою собственную роль.
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: Новая роль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_admin_transport_http.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Обновлённые данные пользователя
          schema:
            $ref: '#/definitions/internal_features_admin_transport_http.AdminUserResponse'
        "400":
          description: Неверный ID пользователя или тело запроса
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Доступ запрещён (не админ или изменение своей роли)
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Изменить роль пользователя
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Авторизует пользователя и сохраняет JWT токен в HttpOnly cookie
      parameters:
      - description: Данные для входа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_features_auth_transport_http_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_features_auth_transport_http_dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Авторизация пользователя
      tags:
      - auth
  /auth/logout:
    post:
      description: Удаляет JWT токен из cookie
      responses:
        "204":
          description: Успешный выход
      summary: Выход из системы
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и сохраняет JWT токен в HttpOnly cookie
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_features_auth_transport_http_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backend_internal_features_auth_transport_http_dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /finance/categories:
    get:
      description: Возвращает все уникальные категории транзакций пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Список категорий
          schema:
            items:
              type: string
            type: array
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Получить категории
      tags:
      - finance
  /finance/dashboard:
    get:
      description: Возвращает финансовый дашборд с метриками, графиком и последними
        операциями
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_finance_transport_http.DashboardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Получить дашборд
      tags:
      - finance
  /finance/transactions:
    get:
      description: Возвращает транзакции пользователя с фильтрацией и пагинацией
      parameters:
      - description: Тип транзакции (income/expense)
        in: query
        name: type
        type: string
      - description: Категория
        in: query
        name: category
        type: string
      - description: Дата начала (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Дата конца (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Лимит (default 20)
        in: query
        name: limit
        type: integer
      - description: Смещение (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_features_finance_transport_http.TransactionResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Получить список транзакций
      tags:
      - finance
    post:
      consumes:
      - application/json
      description: Создаёт новую транзакцию (доход или расход)
      parameters:
      - description: Данные транзакции
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_finance_transport_http.CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_finance_transport_http.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Создать транзакцию
      tags:
      - finance
  /finance/transactions/{id}:
    delete:
      description: Удаляет транзакцию по ID
      parameters:
      - description: ID транзакции
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Успешно удалено
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Удалить транзакцию
      tags:
      - finance
    get:
      description: Возвращает детали транзакции по ID
      parameters:
      - description: ID транзакции
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_finance_transport_http.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Получить транзакцию
      tags:
      - finance
    put:
      consumes:
      - application/json
      description: Обновляет существующую транзакцию
      parameters:
      - description: ID транзакции
        in: path
        name: id
        required: true
        type: integer
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_finance_transport_http.UpdateTransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_finance_transport_http.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Обновить транзакцию
      tags:
      - finance
  /users/{id}:
    delete:
      description: Удаление существующего пользователя по его ID
      parameters:
      - description: ID удаляемого пользователя
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Успешное удаление пользователя
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Удаление пользователя
      tags:
      - users
    get:
      description: Получение существующего пользователя по его ID
      parameters:
      - description: ID получаемого пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно найден пользователь
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.GetUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/backend_internal_core_transport_http_response.ErrorResponse'
      summary: Получение пользователя
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Изменения информации о существующем пользователе по его ID
        ### Логика обновления полей
        1 Поле не передано `phone_number` игнорируется, значение в бд не меняется
        2 Явно передано значения `"phone_number":"+799999999"` - устанавливает новый номер телефона
        3 Передан null `"phone_number": null` - очищает поле в БД (set to NULL)
        Ограничение: `full_name` не может быть выставлен как null
      parameters:
      - description: ID изменяемого пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: PatchUser тело запроса
        in: body
        name: request
