version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/daniiiiiiiiiiil/finance-microservices/gateway-service/proto/gen/v1
  disable:
    - path: google/api
plugins:
  - local: protoc-gen-go
    out: gateway-service/proto/gen/v1
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gateway-service/proto/gen/v1
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: gateway-service/proto/gen/v1
    opt: paths=source_relative