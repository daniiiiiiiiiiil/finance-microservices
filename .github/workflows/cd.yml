name: CD
#
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy project to server via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: ${{ secrets.TIMEWEB_USER }}
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          source: "."
          target: "/opt/finance-microservices"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: ${{ secrets.TIMEWEB_USER }}
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            cd /opt/finance-microservices
            docker compose down
            docker compose pull || true
            nohup docker compose up -d --build > build.log 2>&1 &
            docker image prune -f
            echo "Деплой запущен в фоне. Логи: /opt/finance-microservices/build.log"