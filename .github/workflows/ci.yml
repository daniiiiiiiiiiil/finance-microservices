# Имя workflow (отображается в GitHub Actions)
name: CI

# События, которые запускают workflow
on:
  # При пуше в ветку master
  push:
    branches: [master]
  # При создании или обновлении Pull Request в master
  pull_request:
    branches: [master]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

# Настройка конкурентности (одновременных запусков)
concurrency:
  # Группа = имя workflow + ссылка на ветку/коммит
  group: ${{ github.workflow }}-${{ github.ref }}
  # Отменять предыдущий запуск, если начался новый
  cancel-in-progress: true

# Список задач (jobs)
jobs:

  # Первая задача: найти все сервисы в репозитории
  detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          services=$(find . -maxdepth 2 -name "go.mod" -exec dirname {} \; | sed 's|^\./||' | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Найдены сервисы: $services"

  # Вторая задача: тестирование и сборка
  lint-and-test:
    needs: detect-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.service }}
        run: go mod download

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Show coverage summary
        working-directory: ${{ matrix.service }}
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        working-directory: ${{ matrix.service }}
        run: |
          mkdir -p bin
          for d in cmd/*/; do
            name=$(basename "$d")
            go build -v -o "bin/${name}" "./cmd/${name}"
          done

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage.out
          retention-days: 7

  # Третья задача: smoke-тест через Docker Compose
  compose-smoke-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env file
        run: |
          cp env.example .env
          echo "--- .env preview (masked) ---"
          sed 's/=.*/=***/' .env

      # Чистим старые данные и контейнеры
      - name: Clean stale data and containers
        run: |
          docker compose down -v --remove-orphans || true
          rm -rf out/pgdata out/redisdata minio-data
          docker rm -f $(docker ps -aq) 2>/dev/null || true
          docker volume prune -f

      # Собираем и запускаем. --wait дождётся, пока все healthcheck не станут healthy.
      # --wait-timeout 600 даёт 10 минут на initdb всех шести Postgres + Kafka на холодном runner'е.
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Check running containers
        run: docker compose ps

      # Диагностика при падении: логи Postgres + health-состояние + все логи
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps -a ==="
          docker compose ps -a
          
          for svc in finance-postgres auth-postgres users-postgres shopping-postgres saga-postgres ai-postgres; do
            echo ""
            echo "===== $svc ====="
            docker compose logs "$svc" --tail=100 || true
            echo "----- health -----"
            docker inspect --format='{{json .State.Health}}' $(docker compose ps -q "$svc") 2>/dev/null | jq || echo "no health info"
          done
          
          echo ""
          echo "=== all container logs ==="
          docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans